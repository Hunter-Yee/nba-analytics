# Note: This docker-compose file is preserved to demonstrate local PostgreSQL database setup.
# In production, the app connects to a Supabase-hosted database.
version: '3.8'

services:
  db:
    image: postgres:15
    container_name: nba_postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: nba_analytics
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
